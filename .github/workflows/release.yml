name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="sbx-${version}"
          mkdir -p "dist/${package}"
          cp -a LICENSE README.md data install.sh lib sbx sbx-route uninstall.sh web "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          cp install.sh dist/install-oneclick.sh
          sed -i "s/readonly DEFAULT_REF=\"main\"/readonly DEFAULT_REF=\"${RELEASE_TAG}\"/" dist/install-oneclick.sh
          (cd dist && sha256sum "${package}.tar.gz" install-oneclick.sh > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## 一键安装

          使用 root 用户执行：

          \`\`\`bash
          curl -fsSL https://github.com/driftbottle61/sbx/releases/download/${RELEASE_TAG}/install-oneclick.sh | bash
          \`\`\`

          本版本会自动检测本机 \`127.0.0.1:8080\` 下载代理，并为 GitHub API、配置及 Sing-box Release 下载统一启用超时和重试。
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/sbx-*.tar.gz \
              dist/install-oneclick.sh \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/sbx-*.tar.gz \
              dist/install-oneclick.sh \
              dist/SHA256SUMS \
              --title "SBX $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          fi

          gh release edit "$RELEASE_TAG" \
            --title "SBX $RELEASE_TAG" \
            --notes-file /tmp/release-notes.md
